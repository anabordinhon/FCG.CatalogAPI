name: Deploy CatalogApi to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./FCG.Catalog
          file: ./FCG.Catalog/FCG.Catalog.API/Dockerfile
          target: runtime
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/catalog-api-image:latest

      - name: Build and push Migrations image
        uses: docker/build-push-action@v5
        with:
          context: ./FCG.Catalog
          file: ./FCG.Catalog/FCG.Catalog.API/Dockerfile
          target: migrations
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/catalog-api-image:migrations

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/app
            docker compose up -d rabbitmq
            echo "Aguardando RabbitMQ ficar healthy..."
            sleep 20
            docker compose pull catalogapi-migration catalogapi
            docker compose up catalogapi-migration --no-deps
            docker compose up -d catalogapi --no-deps
            docker compose ps
            docker image prune -f
