apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogapi-deployment
  namespace: default
  labels:
    app: catalogapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogapi
  template:
    metadata:
      labels:
        app: catalogapi
    spec:
      initContainers:
        - name: migration
          image: catalogapi-migrations:latest
          imagePullPolicy: Never
          workingDir: /src
          command:
            - dotnet
            - ef
            - --configuration
            - Release
            - --project
            - FCG.Catalog.Infrastructure
            - --startup-project
            - FCG.Catalog.API
            - database
            - update
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: catalogapi-secret
                  key: ConnectionStrings__DefaultConnection

            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: catalogapi-config
                  key: ASPNETCORE_ENVIRONMENT

      containers:
        - name: catalogapi
          image: catalogapi:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8080
              name: http

          env:
            - name: RabbitMQ__Host
              valueFrom:
                configMapKeyRef:
                  name: catalogapi-config
                  key: RabbitMQ__Host

            - name: RabbitMQ__Username
              valueFrom:
                configMapKeyRef:
                  name: catalogapi-config
                  key: RabbitMQ__Username

            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: catalogapi-secret
                  key: RabbitMQ__Password

            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: catalogapi-secret
                  key: ConnectionStrings__DefaultConnection

            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: catalogapi-secret
                  key: Jwt__SecretKey

            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: catalogapi-config
                  key: ASPNETCORE_ENVIRONMENT

            - name: ASPNETCORE_URLS
              valueFrom:
                configMapKeyRef:
                  name: catalogapi-config
                  key: ASPNETCORE_URLS

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
