apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogapi-deployment
  namespace: default
  labels:
    app: catalogapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogapi
  template:
    metadata:
      labels:
        app: catalogapi
    spec:
      initContainers:
      - name: migration
        image: catalogapi:latest
        imagePullPolicy: Never
        command: 
          - dotnet
          - ef
          - database
          - update
          - --no-build
        env:
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: catalogapi-secret
              key: ConnectionStrings__DefaultConnection
       
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: catalogapi-config
              key: ASPNETCORE_ENVIRONMENT
      
      containers:
      - name: catalogapi
        image: catalogapi:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        
        env:
        - name: RabbitMQ__Host
          valueFrom:
            configMapKeyRef:
              name: catalogapi-config
              key: RabbitMQ__Host
        
        - name: RabbitMQ__Username
          valueFrom:
            configMapKeyRef:
              name: catalogapi-config
              key: RabbitMQ__Username
        
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: catalogapi-config
              key: ASPNETCORE_ENVIRONMENT
        
        - name: ASPNETCORE_URLS
          valueFrom:
            configMapKeyRef:
              name: catalogapi-config
              key: ASPNETCORE_URLS
        
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: catalogapi-secret
              key: ConnectionStrings__DefaultConnection
        
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: catalogapi-secret
              key: RabbitMQ__Password
        
        - name: Jwt__SecretKey
          valueFrom:
            secretKeyRef:
              name: catalogapi-secret
              key: Jwt__SecretKey
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          httpGet